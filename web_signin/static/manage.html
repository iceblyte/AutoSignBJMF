<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>签到任务后台管理</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/theme.css" />
  <script src="/static/theme.js" defer></script>
  <style>
    .admin-page { padding: 20px 20px 40px; }
    .admin-shell {
      max-width: 1320px; margin: 0 auto;
      display: grid; grid-template-columns: 216px minmax(0, 1fr);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--sh-2);
      overflow: hidden; min-height: calc(100vh - 100px);
    }
    .sidebar {
      background: var(--surface-2); border-right: 1px solid var(--border);
      padding: 14px 10px; display: flex; flex-direction: column; gap: 3px;
    }
    .s-brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; font-size: 13.5px; font-weight: 600; }
    .nav-item {
      display: flex; align-items: center; gap: 9px;
      height: 32px; padding: 0 9px; border-radius: var(--r-xs);
      font-size: 13px; font-weight: 500; color: var(--text-2);
      cursor: pointer; border: 1px solid transparent;
    }
    .nav-item:hover { background: var(--muted); color: var(--text); }
    .nav-item.active { background: var(--surface); color: var(--text); font-weight: 590; border-color: var(--border); box-shadow: var(--sh-1); }
    .nav-item .count { margin-left: auto; font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; }
    .side-foot { margin-top: auto; border-top: 1px solid var(--border); padding: 12px 8px 2px; display: flex; align-items: center; gap: 8px; }

    .admin-main { display: flex; flex-direction: column; min-width: 0; }
    .admin-head { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .admin-head .input, .admin-head .btn, .admin-head select { height: 32px; }
    .admin-head .input { width: 156px; }
    .admin-head select { width: 118px; }

    .metric-strip { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-bottom: 1px solid var(--border); }
    .metric { padding: 11px 18px; border-right: 1px solid var(--border); }
    .metric:last-child { border-right: 0; }
    .metric .k { font-size: 11.5px; color: var(--text-3); font-weight: 500; }
    .metric .v { font-size: 19px; font-weight: 620; letter-spacing: -0.03em; margin-top: 2px; font-variant-numeric: tabular-nums; }

    .admin-body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; flex: 1; min-height: 0; }
    .table-pane { min-width: 0; padding: 6px 18px 18px; overflow: auto; }
    .detail-pane { border-left: 1px solid var(--border); background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
    .detail-title { font-size: 13.5px; font-weight: 590; }
    .detail-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .detail-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .log-box { border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2); max-height: 260px; overflow: auto; }

    .auth-mask {
      position: fixed; inset: 0; z-index: 50;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(10px) saturate(140%);
    }
    .auth-mask[hidden] { display: none; }
    .auth-card {
      width: 360px; max-width: calc(100vw - 32px);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-xl); box-shadow: 0 24px 60px -18px rgba(16, 24, 40, .35);
      padding: 24px;
    }
    .auth-card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 620; letter-spacing: -0.02em; }
    .auth-card p { margin: 0 0 14px; font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
    .auth-card .field-col + .field-col { margin-top: 12px; }
    .auth-error { color: var(--danger); font-size: 12.5px; min-height: 18px; }
    #editWxKey, #editQqKey { flex: 1 1 0; width: 0; }
    @media (max-width: 1080px) {
      .admin-shell { grid-template-columns: 1fr; }
      .sidebar { flex-direction: row; align-items: center; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); }
      .s-brand { padding: 4px 8px; }
      .side-foot { margin: 0 0 0 auto; border: 0; padding: 0; }
      .admin-body { grid-template-columns: 1fr; }
      .detail-pane { border-left: 0; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo-mark" src="/static/logo.png" alt="" width="24" height="24" aria-hidden="true" />
      <div>
        <div class="brand-title">签到任务后台管理</div>
        <div class="brand-sub">查看、筛选、启用或删除任务，并浏览执行日志</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="status-text">
        <span id="healthDot" class="status-dot"></span>
        <span id="healthText">后端状态：未知</span>
      </span>
      <a class="btn btn-sm" href="/">返回用户端</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="切换明暗">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4 17 7M7 17l-1.6 1.6" />
        </svg>
      </button>
    </div>
  </header>

  <main class="admin-page">
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="s-brand">
          <img class="logo-mark" src="/static/logo.png" alt="" width="22" height="22" aria-hidden="true" />
          自动签到
        </div>
        <div class="nav-item active" role="button" tabindex="0">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M8 4v16M3 10h18"/></svg>
          任务
          <span class="count" id="navCount">0</span>
        </div>
        <div class="nav-item" id="navLogs" role="button" tabindex="0" onclick="document.getElementById(&quot;logList&quot;).scrollIntoView({behavior:&quot;smooth&quot;,block:&quot;center&quot;})">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/></svg>
          执行日志
        </div>
        <div class="nav-item" role="button" tabindex="0" onclick="location.href='/'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          新建任务
        </div>
        <div class="side-foot">
          <span class="pill ok" id="adminStatePill"><span class="sdot"></span>已登录</span>
        </div>
      </aside>

      <div class="admin-main">
        <div class="admin-head">
          <div class="search-row" style="display:flex;gap:8px;flex-wrap:wrap">
            <input id="filterName" class="input" placeholder="搜索姓名" />
            <input id="filterClass" class="input" placeholder="搜索班级" />
            <select id="filterEnabled" class="input">
              <option value="">全部状态</option>
              <option value="1">仅启用</option>
              <option value="0">仅禁用</option>
            </select>
          </div>
          <span class="spacer"></span>
          <button id="btnReloadTasks" class="btn btn-sm" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 6"/><path d="M20 4v7h-7"/></svg>
            刷新列表
          </button>
        </div>

        <div class="metric-strip">
          <div class="metric"><div class="k">任务总数</div><div class="v" id="metricTotal">0</div></div>
          <div class="metric"><div class="k">已启用</div><div class="v" id="metricOn" style="color:var(--success)">0</div></div>
          <div class="metric"><div class="k">已禁用</div><div class="v" id="metricOff" style="color:var(--text-2)">0</div></div>
        </div>

        <div class="admin-body">
          <div class="table-pane">
            <div class="scroll">
              <table>
                <thead>
                  <tr>
                    <th style="width:56px">ID</th>
                    <th>姓名 / 班级</th>
                    <th>坐标</th>
                    <th>时间点</th>
                    <th style="width:72px">状态</th>
                    <th style="width:74px"></th>
                  </tr>
                </thead>
                <tbody id="taskTableBody">
                  <tr><td colspan="6" class="hint-text">正在加载任务列表…</td></tr>
                </tbody>
              </table>
            </div>
          </div>

          <div class="detail-pane" id="detailPane">
            <div>
              <div class="detail-title" id="currentTaskLabel">未选择任务</div>
              <div class="detail-sub">在左侧列表点「选择」后即可编辑</div>
            </div>

            <div class="field-col">
              <label class="label" for="editCoord">坐标（纬度 经度）</label>
              <input id="editCoord" class="input mono" placeholder="例如 39.908700 116.397500" />
            </div>

            <div class="field-col">
              <div class="label">通知 Key</div>
              <div class="field-row">
                <input id="editWxKey" class="input mono" placeholder="WXKey" style="flex:1" />
                <input id="editQqKey" class="input mono" placeholder="QmsgKEY" style="flex:1" />
              </div>
            </div>

            <div class="field-col">
              <label class="label" for="editTimes">执行时间点</label>
              <input id="editTimes" class="input mono" placeholder="07:30:00,12:00:00" />
              <div class="hint-text">多个时间点用英文逗号分隔</div>
            </div>

            <div class="field-col">
              <label class="label" for="editEnabled">任务状态</label>
              <select id="editEnabled" class="input">
                <option value="1">启用</option>
                <option value="0">禁用</option>
              </select>
            </div>

            <div class="detail-actions">
              <button id="btnSaveTask" class="btn btn-primary btn-sm" type="button">保存修改</button>
              <button id="btnDeleteTask" class="btn btn-danger btn-sm" type="button">删除任务</button>
            </div>

            <hr class="divider" style="margin:2px 0" />

            <div>
              <div class="row-between">
                <div class="detail-title">最近执行日志</div>
                <button id="btnReloadLogs" class="btn btn-sm btn-ghost" type="button">刷新日志</button>
              </div>
              <div class="detail-sub">最多显示 50 条</div>
            </div>
            <div id="logList" class="log-box">
              <div class="hint-text" style="padding:12px">请选择左侧任务后，再点「刷新日志」。</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="authMask" class="auth-mask">
    <div class="auth-card">
      <h2 id="authTitle">管理员登录</h2>
      <p id="authHint"></p>
      <div class="field-col">
        <label class="label" for="authKey">管理员 Key</label>
        <input id="authKey" class="input" type="password" placeholder="请输入管理员 Key" autocomplete="current-password" />
      </div>
      <div class="auth-error" id="authError"></div>
      <div class="row" style="justify-content:flex-end;margin-top:6px">
        <button id="btnAuthSubmit" class="btn btn-primary" type="button">登录</button>
      </div>
    </div>
  </div>

  <script>
    const apiBase = "";

    const healthDot = document.getElementById("healthDot");
    const healthText = document.getElementById("healthText");

    const filterName = document.getElementById("filterName");
    const filterClass = document.getElementById("filterClass");
    const filterEnabled = document.getElementById("filterEnabled");
    const btnReloadTasks = document.getElementById("btnReloadTasks");
    const taskTableBody = document.getElementById("taskTableBody");

    const currentTaskLabel = document.getElementById("currentTaskLabel");
    const editCoord = document.getElementById("editCoord");
    const editWxKey = document.getElementById("editWxKey");
    const editQqKey = document.getElementById("editQqKey");
    const editTimes = document.getElementById("editTimes");
    const editEnabled = document.getElementById("editEnabled");
    const btnSaveTask = document.getElementById("btnSaveTask");
    const btnDeleteTask = document.getElementById("btnDeleteTask");

    const logList = document.getElementById("logList");
    const btnReloadLogs = document.getElementById("btnReloadLogs");

    let currentTaskId = null;
    let tasksCache = [];

    // ===== 管理员鉴权：Key 只存在 sessionStorage，调用 admin 接口时带 X-Admin-Token =====
    const authMask = document.getElementById("authMask");
    const authTitle = document.getElementById("authTitle");
    const authHint = document.getElementById("authHint");
    const authKey = document.getElementById("authKey");
    const authError = document.getElementById("authError");
    const btnAuthSubmit = document.getElementById("btnAuthSubmit");

    let adminToken = sessionStorage.getItem("adminToken") || "";
    let needInit = false;

    async function refreshAuthMode() {
      try {
        const resp = await fetch(apiBase + "/api/admin/status");
        const data = await resp.json();
        needInit = !data.initialized;
      } catch (e) {
        needInit = false;
      }
      authTitle.textContent = needInit ? "初始化管理员 Key" : "管理员登录";
      authHint.textContent = needInit
        ? "首次使用请设置一个管理员 Key（数据库里只存 SHA-256 哈希）。设置成功后会用同一个 Key 自动登录。"
        : "后台管理接口需要管理员 Key。Key 只保存在当前标签页，关闭标签页即失效。";
      btnAuthSubmit.textContent = needInit ? "设置并登录" : "登录";
      authError.textContent = "";
      authKey.value = "";
      authMask.classList.add("show");
      authKey.focus();
    }

    function hideAuth() {
      authMask.classList.remove("show");
    }

    async function adminFetch(url, options) {
      const opts = Object.assign({}, options || {});
      const headers = Object.assign({}, opts.headers || {});
      if (adminToken) headers["X-Admin-Token"] = adminToken;
      opts.headers = headers;
      const resp = await fetch(apiBase + url, opts);
      if (resp.status === 401) {
        adminToken = "";
        sessionStorage.removeItem("adminToken");
        refreshAuthMode();
      }
      return resp;
    }

    async function submitAuth() {
      const key = authKey.value.trim();
      if (!key) {
        authError.textContent = "请输入管理员 Key";
        return;
      }
      try {
        const endpoint = needInit ? "/api/admin/init" : "/api/admin/login";
        const resp = await fetch(apiBase + endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key })
        });
        const data = await resp.json();
        if (!resp.ok) {
          authError.textContent = data.error || "操作失败";
          return;
        }
        if (needInit) {
          // 初始化成功后立刻用同一个 Key 换 token
          needInit = false;
          await submitAuth();
          return;
        }
        adminToken = data.token || "";
        if (adminToken) sessionStorage.setItem("adminToken", adminToken);
        hideAuth();
        loadTasks();
      } catch (e) {
        authError.textContent = "请求失败：" + e.message;
      }
    }

    btnAuthSubmit.addEventListener("click", submitAuth);
    authKey.addEventListener("keydown", event => {
      if (event.key === "Enter") submitAuth();
    });

    function setHealth(ok) {
      healthDot.className = "status-dot" + (ok ? " ok" : " bad");
      healthText.textContent = ok ? "后端状态：在线" : "后端状态：不可用";
    }

    async function checkHealth() {
      try {
        const resp = await fetch(apiBase + "/health");
        const data = await resp.json();
        setHealth(data.status === "ok");
      } catch (e) {
        setHealth(false);
      }
    }

    function updateMetrics() {
      const total = tasksCache.length;
      const enabled = tasksCache.filter((t) => t.enabled).length;
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = String(value);
      };
      setText("metricTotal", total);
      setText("metricOn", enabled);
      setText("metricOff", total - enabled);
      setText("navCount", total);
    }

    function renderTasks() {
      taskTableBody.innerHTML = "";
      if (!tasksCache.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 6;
        td.textContent = "暂无任务。";
        tr.appendChild(td);
        taskTableBody.appendChild(tr);
        return;
      }
      tasksCache.forEach(task => {
        const tr = document.createElement("tr");
        tr.dataset.id = task.id;
        const tdId = document.createElement("td");
        tdId.textContent = String(task.id);
        const tdUser = document.createElement("td");
        tdUser.textContent = task.name + (task.class_id ? " / " + task.class_id : "");
        const tdCoord = document.createElement("td");
        tdCoord.textContent = (task.lat || "") + (task.lng ? " " + task.lng : "");
        const tdTimes = document.createElement("td");
        tdTimes.textContent = Array.isArray(task.times) ? task.times.join(",") : "";
        const tdEnabled = document.createElement("td");
        const span = document.createElement("span");
        span.className = "tag " + (task.enabled ? "tag-on" : "tag-off");
        span.textContent = task.enabled ? "启用" : "禁用";
        tdEnabled.appendChild(span);
        const tdOps = document.createElement("td");
        const btnSelect = document.createElement("button");
        btnSelect.className = "btn btn-ghost";
        btnSelect.textContent = "选择";
        btnSelect.style.fontSize = "11px";
        btnSelect.addEventListener("click", () => selectTask(task.id));
        tdOps.appendChild(btnSelect);

        tr.appendChild(tdId);
        tr.appendChild(tdUser);
        tr.appendChild(tdCoord);
        tr.appendChild(tdTimes);
        tr.appendChild(tdEnabled);
        tr.appendChild(tdOps);
        if (task.id === currentTaskId) tr.classList.add("is-selected");
        taskTableBody.appendChild(tr);
      });
      updateMetrics();
    }

    async function loadTasks() {
      const params = new URLSearchParams();
      if (filterName.value.trim()) params.set("name", filterName.value.trim());
      if (filterClass.value.trim()) params.set("class_id", filterClass.value.trim());
      if (filterEnabled.value) params.set("enabled", filterEnabled.value);
      try {
        const resp = await adminFetch("/api/admin/tasks?" + params.toString());
        const data = await resp.json();
        if (!resp.ok) {
          taskTableBody.innerHTML = "<tr><td colspan='6'>加载失败：" + (data.error || "未知错误") + "</td></tr>";
          return;
        }
        tasksCache = Array.isArray(data) ? data : [];
        renderTasks();
      } catch (e) {
        taskTableBody.innerHTML = "<tr><td colspan='6'>请求失败：" + e.message + "</td></tr>";
      }
    }

    function selectTask(id) {
      currentTaskId = id;
      taskTableBody.querySelectorAll("tr").forEach((row) => {
        row.classList.toggle("is-selected", Number(row.dataset.id) === id);
      });
      const t = tasksCache.find(x => x.id === id);
      if (!t) {
        currentTaskLabel.textContent = "未选择任务";
        return;
      }
      currentTaskLabel.textContent = `#${t.id} ${t.name} (${t.class_id || "无班级信息"})`;
      editCoord.value = (t.lat || "") + (t.lng ? " " + t.lng : "");
      editWxKey.value = t.wx_key || "";
      editQqKey.value = t.qq_key || "";
      editTimes.value = (Array.isArray(t.times) ? t.times.join(",") : "");
      editEnabled.value = t.enabled ? "1" : "0";
      loadLogsForCurrent();
    }

    async function saveTask() {
      if (!currentTaskId) {
        alert("请先在左侧选择一个任务。");
        return;
      }
      const coord = editCoord.value.trim();
      let lat = null, lng = null;
      if (coord) {
        const parts = coord.replace(/[，|、]+/g, " ").split(/\s+/).filter(Boolean);
        if (parts.length >= 2) {
          lat = parts[0];
          lng = parts[1];
        }
      }
      const timesStr = editTimes.value.trim();
      let times = [];
      if (timesStr) {
        times = timesStr.split(",").map(s => s.trim()).filter(Boolean);
      }
      const payload = {
        lat,
        lng,
        wx_key: editWxKey.value.trim(),
        qq_key: editQqKey.value.trim(),
        times,
        enabled: editEnabled.value === "1"
      };
      try {
        const resp = await adminFetch("/api/admin/tasks/" + currentTaskId, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) {
          alert("保存失败：" + (data.error || "未知错误"));
          return;
        }
        alert("保存成功。");
        loadTasks();
      } catch (e) {
        alert("请求失败：" + e.message);
      }
    }

    async function deleteTask() {
      if (!currentTaskId) {
        alert("请先选择要删除的任务。");
        return;
      }
      if (!confirm("确定要删除该任务及其所有日志吗？此操作不可恢复。")) {
        return;
      }
      try {
        const resp = await adminFetch("/api/admin/tasks/" + currentTaskId, {
          method: "DELETE"
        });
        const data = await resp.json();
        if (!resp.ok) {
          alert("删除失败：" + (data.error || "未知错误"));
          return;
        }
        alert("删除成功。");
        currentTaskId = null;
        currentTaskLabel.textContent = "未选择任务";
        editCoord.value = "";
        editWxKey.value = "";
        editQqKey.value = "";
        editTimes.value = "";
        logList.innerHTML = '<div class="status-text">任务已删除。</div>';
        loadTasks();
      } catch (e) {
        alert("请求失败：" + e.message);
      }
    }

    async function loadLogsForCurrent() {
      if (!currentTaskId) {
        logList.innerHTML = '<div class="status-text">请选择任务。</div>';
        return;
      }
      try {
        const params = new URLSearchParams({ task_id: String(currentTaskId), limit: "50" });
        const resp = await adminFetch("/api/admin/logs?" + params.toString());
        const data = await resp.json();
        if (!resp.ok) {
          logList.innerHTML = '<div class="status-text">加载失败：' + (data.error || "未知错误") + "</div>";
          return;
        }
        const logs = Array.isArray(data) ? data : [];
        if (!logs.length) {
          logList.innerHTML = '<div class="status-text">暂无日志。</div>';
          return;
        }
        logList.innerHTML = "";
        logs.forEach(log => {
          const div = document.createElement("div");
          div.className = "log-item";
          const t = document.createElement("div");
          t.className = "log-time";
          t.textContent = log.run_at || "";
          const taskInfo = document.createElement("div");
          taskInfo.className = "log-task";
          if (log.task) {
            const parts = [];
            if (log.task.name) parts.push(log.task.name);
            if (log.task.class_id) parts.push("班级：" + log.task.class_id);
            taskInfo.textContent = parts.join(" · ");
          }
          const s = document.createElement("div");
          s.className = "log-status";
          if (log.status === "error") s.classList.add("error");
          s.textContent = "状态：" + (log.status || "未知");
          const msg = document.createElement("pre");
          msg.className = "log-message";
          msg.textContent = log.message || "";
          div.appendChild(t);
          if (taskInfo.textContent) div.appendChild(taskInfo);
          div.appendChild(s);
          div.appendChild(msg);
          logList.appendChild(div);
        });
      } catch (e) {
        logList.innerHTML = '<div class="status-text">请求失败：' + e.message + "</div>";
      }
    }

    btnReloadTasks.addEventListener("click", loadTasks);
    btnSaveTask.addEventListener("click", saveTask);
    btnDeleteTask.addEventListener("click", deleteTask);
    btnReloadLogs.addEventListener("click", loadLogsForCurrent);

    window.addEventListener("load", () => {
      checkHealth();
      if (!adminToken) {
        refreshAuthMode();
        return;
      }
      loadTasks();
    });
  </script>
</body>
</html>
