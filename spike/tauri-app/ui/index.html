<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>bjmf spike</title>
<style>
  :root { --bg:#f5f5f7; --surface:#fff; --border:#e4e4e7; --text:#18181b; --text2:#52525b; --text3:#71717a; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#131519; --surface:#1f2228; --border:#31363f; --text:#f2f3f5; --text2:#b5becb; --text3:#98a2b3; --accent:#4b8bf5; } }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:"Segoe UI Variable Text","Microsoft YaHei UI",sans-serif; }
  .card { width:420px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:22px;
          box-shadow:0 1px 3px rgba(16,24,40,.06); text-align:center; }
  h1 { font-size:15px; margin:0 0 6px; }
  p { font-size:12.5px; color:var(--text3); margin:0 0 14px; }
  button { height:32px; padding:0 14px; border-radius:8px; border:0; background:var(--accent); color:#fff; font-size:13px; cursor:pointer; }
  code { font-family:Consolas,monospace; color:var(--text2); }
</style>
</head>
<body>
  <div class="card">
    <h1>Tauri spike</h1>
    <p>这个窗口是 <code>--open</code> 时才创建的；不传参数启动时不建窗口。</p>
    <button id="ping">测试 Rust 命令</button>
    <p id="out" style="margin-top:10px">—</p>
  </div>
<script>
  document.getElementById('ping').onclick = async () => {
    const r = await window.__TAURI__.core.invoke('ping');
    document.getElementById('out').textContent = 'Rust 返回：' + r;
  };
</script>
</body>
</html>
