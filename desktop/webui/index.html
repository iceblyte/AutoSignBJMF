<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>班级魔方自动签到</title>
<style>
  :root {
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --mono: "Cascadia Mono", "Consolas", monospace;
    --bg: #f5f5f7; --surface: #ffffff; --surface2: #fafafa; --muted: #f4f4f5;
    --border: #e4e4e7; --border-strong: #d4d4d8;
    --text: #18181b; --text2: #52525b; --text3: #71717a;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff4ff;
    --success: #0d9488; --success-soft: #ecfdfa;
    --warning: #b45309; --warning-soft: #fffaeb;
    --danger: #b91c1c; --danger-soft: #fef2f2;
    --r-sm: 8px; --r-md: 10px; --r-lg: 12px; --r-xl: 14px;
    --sh1: 0 1px 2px rgba(16,24,40,.05);
    --sh2: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131519; --surface: #1f2228; --surface2: #1b1e23; --muted: #262a31;
      --border: #31363f; --border-strong: #3f4650;
      --text: #f2f3f5; --text2: #b5becb; --text3: #98a2b3;
      --accent: #4b8bf5; --accent-hover: #6aa0f7; --accent-soft: #16233b;
      --success: #2dd4bf; --success-soft: #0f2b28;
      --warning: #fbbf24; --warning-soft: #2a2113;
      --danger: #f87171; --danger-soft: #2b1618;
      --sh1: 0 1px 2px rgba(0,0,0,.35); --sh2: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); font-size: 13.5px; color: var(--text);
    background: var(--bg); letter-spacing: -.006em;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button, input, select { font: inherit; }
  .app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .logo { width: 30px; height: 30px; object-fit: contain; }
  .titles .t { font-size: 14px; font-weight: 620; letter-spacing: -.02em; }
  .titles .s { font-size: 12px; color: var(--text3); }
  .grow { flex: 1; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 9px; border-radius: 999px;
    font-size: 12px; font-weight: 550; background: var(--muted); color: var(--text2);
  }
  .pill.ok { background: var(--success-soft); color: var(--success); }
  .pill.warn { background: var(--warning-soft); color: var(--warning); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .switch { width: 34px; height: 20px; border: 0; border-radius: 999px; background: var(--border-strong); position: relative; cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch[data-on="true"] { background: var(--accent); }
  .switch[data-on="true"]::after { transform: translateX(14px); }
  .switch-label { font-size: 12px; color: var(--text3); }

  main { display: flex; flex: 1; min-height: 0; padding: 12px; gap: 12px; }

  .side {
    width: 244px; flex: none; display: flex; flex-direction: column;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden;
  }
  .side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 8px; }
  .side-head .lbl { font-size: 11.5px; font-weight: 590; color: var(--text3); letter-spacing: .02em; }
  .students { flex: 1; overflow: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .student {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px;
    border: 1px solid transparent; border-radius: var(--r-sm); cursor: pointer;
  }
  .student:hover { background: var(--muted); }
  .student.active { background: var(--surface); border-color: var(--border); box-shadow: var(--sh1); }
  .avatar {
    width: 26px; height: 26px; flex: none; border-radius: 8px; display: grid; place-items: center;
    font-size: 11.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent);
  }
  .student .n { font-size: 13px; font-weight: 550; }
  .student .c { font-size: 11.5px; color: var(--text3); font-family: var(--mono); }
  .side-foot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text3); }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 12px; flex: 1; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--sh1); display: flex; flex-direction: column; min-height: 0; }
  .card-head { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .card-head .t { font-size: 12.5px; font-weight: 590; color: var(--text2); }
  .card-body { padding: 12px 14px; }
  .card-body.grid2 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .card-body.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text3); }
  input[type="text"], input[type="time"], select {
    height: 32px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: var(--r-sm);
    background: var(--surface); color: var(--text); outline: none; min-width: 0;
  }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.18); }
  .mono { font-family: var(--mono); font-size: 12px; }

  .btn {
    height: 30px; padding: 0 12px; border-radius: var(--r-sm); cursor: pointer;
    border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
    font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: var(--sh1); transition: background .13s, border-color .13s;
  }
  .btn:hover { background: var(--surface2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 25px; padding: 0 5px 0 9px;
    font-family: var(--mono); font-size: 12px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(37,99,235,.25);
  }
  .chip button { border: 0; background: transparent; color: inherit; cursor: pointer; opacity: .6; font-size: 13px; line-height: 1; }
  .chip button:hover { opacity: 1; }

  .log { flex: 1; min-height: 0; }
  pre.logs {
    margin: 0; padding: 10px 14px; flex: 1; overflow: auto;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--text2);
    background: var(--surface2); border-radius: 0 0 var(--r-lg) var(--r-lg);
    white-space: pre-wrap; word-break: break-word;
  }
  .bar { display: flex; align-items: center; gap: 8px; padding: 2px 2px 0; font-size: 12px; color: var(--text3); }

  .modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(15,18,24,.45); backdrop-filter: blur(4px); z-index: 20; }
  .modal.show { display: grid; }
  .modal-card { width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: 0 24px 60px -18px rgba(16,24,40,.35); padding: 18px; text-align: center; }
  .modal-card h3 { margin: 0 0 4px; font-size: 14px; }
  .modal-card p { margin: 0 0 12px; font-size: 12px; color: var(--text3); }
  .qr-box { width: 200px; height: 200px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r-md); }
  .qr-box img { width: 100%; height: 100%; object-fit: contain; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--sh2); border-radius: 999px; padding: 7px 14px; font-size: 12.5px; color: var(--text2); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>

    <div class="titles">
      <div class="t">班级魔方自动签到</div>
      <div class="s">扫码一次，之后每天按时间自动签到</div>
    </div>
    <span class="grow"></span>
    <span class="switch-label">开机自启</span>
    <button class="switch" id="autostart" data-on="false" title="开机自启"></button>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">未运行</span></span>
  </header>

  <main>
    <aside class="side">
      <div class="side-head">
        <span class="lbl">账号</span>
        <button class="btn sm" id="btnQr">扫码添加</button>
      </div>
      <div class="students" id="students"></div>
      <div class="side-foot">
        <span id="dataHint">数据：—</span>
      </div>
    </aside>

    <section class="content">
      <div class="card">
        <div class="card-head"><span class="t">位置与通知</span><span class="grow"></span><span id="who" style="font-size:12px;color:var(--text3)">未选择账号</span></div>
        <div class="card-body grid2">
          <label class="f">纬度<input id="lat" class="mono" type="text" /></label>
          <label class="f">经度<input id="lng" class="mono" type="text" /></label>
          <label class="f">精度<input id="acc" class="mono" type="text" /></label>
          <label class="f">微信 Key<input id="wx" class="mono" type="text" /></label>
          <label class="f">QQ Key<input id="qq" class="mono" type="text" /></label>
          <div style="display:flex;align-items:flex-end;gap:8px">
            <button class="btn" id="btnAmap">打开拾取器</button>
            <button class="btn primary" id="btnSave">保存</button>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="card" style="width:360px;flex:none">
          <div class="card-head"><span class="t">每天执行时间</span></div>
          <div class="card-body">
            <div style="display:flex;gap:8px;align-items:center">
              <input id="timeInput" type="time" step="1" style="flex:1" />
              <button class="btn primary" id="btnAddTime">添加</button>
            </div>
            <div class="chips" id="chips"></div>
            <div style="display:flex;gap:8px;align-items:center;margin-top:14px">
              <label class="f" style="flex:1">失败重试次数<input id="retryAttempts" class="mono" type="text" /></label>
              <label class="f" style="flex:1">间隔（分钟）<input id="retryDelay" class="mono" type="text" /></label>
            </div>
            <button class="btn sm" id="btnSaveSettings" style="margin-top:10px">保存设置</button>
          </div>
        </div>

        <div class="card log">
          <div class="card-head"><span class="t">运行日志</span><span class="grow"></span><button class="btn sm" id="btnOpenDir">打开目录</button></div>
          <pre class="logs" id="logs"></pre>
        </div>
      </div>

      <div class="bar">
        <button class="btn primary" id="btnStart">启动后台运行</button>
        <button class="btn" id="btnStop">停止</button>
        <button class="btn" id="btnRunNow">立即签到一次</button>
        <span class="grow"></span>
        <span id="nextRun">—</span>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="qrModal">
  <div class="modal-card">
    <h3>微信扫码登录</h3>
    <p id="qrHint">用手机微信扫描下方二维码</p>
    <div class="qr-box"><img id="qrImg" alt="登录二维码" /></div>
    <button class="btn" id="btnQrClose">关闭</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let api = null;
  let booted = false;
  let state = null;
  let qrTimer = null;
  let toastTimer = null;

  function toast(text) {
    const el = $("toast");
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  function renderStudents() {
    const box = $("students");
    const list = state.students || [];
    if (!list.length) {
      box.innerHTML = '<div style="padding:18px 8px;color:var(--text3);font-size:12px;text-align:center">还没有账号<br/>点右上角「扫码添加」</div>';
      return;
    }
    box.innerHTML = list.map((s, i) => `
      <div class="student ${i === state.selected ? "active" : ""}" data-i="${i}">
        <span class="avatar">${esc((s.name || "?").slice(0, 1))}</span>
        <div style="min-width:0">
          <div class="n">${esc(s.name || "未命名")}</div>
          <div class="c">${esc(s.class_id || "—")}</div>
        </div>
      </div>`).join("");
    box.querySelectorAll(".student").forEach((el) => {
      el.onclick = async () => {
        state = await api.select_student(Number(el.dataset.i));
        render();
      };
    });
  }

  function fillForm() {
    const s = state.student || {};
    $("lat").value = s.lat || "";
    $("lng").value = s.lng || "";
    $("acc").value = s.acc || "30";
    $("wx").value = s.WXKey || "";
    $("qq").value = s.QQKey || "";
    $("who").textContent = s.name ? `${s.name} · ${s.class || "—"}` : "未选择账号";
    $("timeInput").value = "07:30:00";
    $("retryAttempts").value = state.settings.retry_attempts;
    $("retryDelay").value = state.settings.retry_delay_minutes;
    $("autostart").dataset.on = String(Boolean(state.settings.autostart));
    $("chips").innerHTML = (state.settings.times || []).map((t) => `
      <span class="chip">${esc(t)}<button data-t="${esc(t)}" title="删除">×</button></span>`).join("");
    $("chips").querySelectorAll("button").forEach((b) => {
      b.onclick = async () => { state = (await api.remove_time(b.dataset.t)).state; render(); };
    });
  }

  function render() {
    renderStudents();
    fillForm();
    $("dataHint").textContent = state.data.portable ? "数据：便携目录 data" : "数据：用户目录";
    $("dataHint").title = state.data.dir;
    updateStatus(state.status);
  }

  function updateStatus(st) {
    if (!st) return;
    const pill = $("statusPill");
    pill.className = "pill " + (st.running && !st.paused ? "ok" : st.paused ? "warn" : "");
    $("statusText").textContent = st.text || "未运行";
    $("btnStart").disabled = Boolean(st.running);
    $("btnStop").disabled = !st.running;
    $("nextRun").textContent = st.next ? `下次执行 ${st.next}${st.countdown ? " · " + st.countdown : ""}` : "—";
  }

  async function boot() {
    if (booted) return;
    booted = true;
    state = await api.state();
    render();
    setInterval(async () => {
      const tick = await api.tick();
      updateStatus(tick);
      const box = $("logs");
      const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
      box.textContent = (tick.logs || []).join("\n");
      if (atBottom) box.scrollTop = box.scrollHeight;
      if (tick.qr_state === "done" && $("qrModal").classList.contains("show")) {
        closeQr();
        state = await api.state();
        render();
      }
    }, 1200);
  }

  function closeQr() {
    clearInterval(qrTimer);
    qrTimer = null;
    $("qrModal").classList.remove("show");
  }

  $("btnQr").onclick = async () => {
    const res = await api.qr_start();
    if (!res.ok) { toast(res.error || "获取二维码失败"); return; }
    $("qrImg").src = res.image;
    $("qrHint").textContent = "用手机微信扫描下方二维码";
    $("qrModal").classList.add("show");
    qrTimer = setInterval(async () => {
      const r = await api.qr_poll();
      if (r.state === "error") { $("qrHint").textContent = r.error || "扫码失败"; clearInterval(qrTimer); }
      if (r.state === "done") {
        closeQr();
        state = await api.state();
        render();
        toast("已添加账号");
      }
    }, 1800);
  };
  $("btnQrClose").onclick = closeQr;

  $("btnSave").onclick = async () => {
    const payload = {
      lat: $("lat").value, lng: $("lng").value, acc: $("acc").value,
      wx: $("wx").value, qq: $("qq").value,
    };
    const res = await api.save_student(payload);
    if (!res.ok) { toast(res.error || "保存失败"); return; }
    state = res.state; render(); toast("已保存");
  };

  $("btnAmap").onclick = () => api.open_amap();
  $("btnOpenDir").onclick = () => api.open_data_dir();
  $("btnAddTime").onclick = async () => {
    const res = await api.add_time($("timeInput").value);
    if (!res.ok) { toast(res.error || "时间格式不对"); return; }
    state = res.state; render();
  };
  $("btnSaveSettings").onclick = async () => {
    const res = await api.save_settings({
      retry_attempts: $("retryAttempts").value,
      retry_delay_minutes: $("retryDelay").value,
      autostart: $("autostart").dataset.on === "true",
    });
    state = res.state; render(); toast("设置已保存");
  };
  $("autostart").onclick = async () => {
    const next = $("autostart").dataset.on !== "true";
    $("autostart").dataset.on = String(next);
    await api.save_settings({ autostart: next });
  };
  $("btnStart").onclick = async () => {
    const res = await api.start();
    if (!res.ok) { toast(res.error || "启动失败"); return; }
    state = res.state; render();
  };
  $("btnStop").onclick = async () => { state = (await api.stop()).state; render(); };
  $("btnRunNow").onclick = async () => { await api.run_now(); toast("已开始执行"); };

  let apiTries = 0;
  function initApi() {
    if (api && api === (window.pywebview && window.pywebview.api)) return;
    if (!window.pywebview || !window.pywebview.api) {
      apiTries += 1;
      if (apiTries === 25) $("statusText").textContent = "无法连接后台（pywebviewready 未触发）";
      return;
    }
    api = window.pywebview.api;
    boot().catch((e) => {
      $("statusText").textContent = "初始化失败: " + (e && e.message ? e.message : e);
    });
  }

  window.addEventListener("pywebviewready", initApi);
  const apiTimer = setInterval(() => { initApi(); if (api) clearInterval(apiTimer); }, 400);
</script>
</body>
</html>
