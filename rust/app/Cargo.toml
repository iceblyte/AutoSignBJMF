[package]
name = "bjmf-app"
description = "班级魔方自动签到 · 桌面端（GPUI）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "AutoSignBJMF"
path = "src/main.rs"

[build-dependencies]
embed-resource = "2"

[dependencies]
bjmf-core = { path = "../core" }
gpui-kit = "0.9"
chrono.workspace = true
serde_json.workspace = true
tray-icon = "0.26"
# 托盘事件用 channel 直接送到 UI 线程，替代「写共享状态 + 每秒轮询」
async-channel = "2"
# 从 &mut Window 直接取 HWND，比枚举顶层窗口可靠
raw-window-handle = "0.6"
rfd = "0.15"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[dev-dependencies]
gpui-kit = { version = "0.9", features = ["test-support"] }
