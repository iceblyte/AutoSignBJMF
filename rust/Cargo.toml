[workspace]
resolver = "2"
# cli 写好了 bjmf-rs，与 Python 版本对拍用；app 是 GPUI 桌面端。
members = ["core", "cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/OWNER/AutoSignBJMF"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
scraper = "0.29"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "cookies",
    "gzip",
    "charset",
    "json",
    "native-tls",
] }
httpmock = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
